<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هوية المطعم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5EFE2;
    --paper:#FFFDF8;
    --ink:#221F1A;
    --ink-soft:#6B6355;
    --pine:#2E4A3A;
    --pine-deep:#1E332A;
    --amber:#C6883A;
    --amber-soft:#EBD3AA;
    --brick:#A0472C;
    --line:#E2D8C2;
    --shadow: 0 10px 30px rgba(34,31,26,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 90% -10%, rgba(198,136,58,0.10), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding: 40px 20px 80px;
  }
  .wrap{ max-width: 860px; margin: 0 auto; }

  /* header */
  .eyebrow{
    display:flex; align-items:center; gap:10px;
    color:var(--ink-soft); font-size:13px; letter-spacing:.03em;
    margin-bottom:6px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);}
  h1{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size: clamp(28px, 4vw, 38px);
    margin: 0 0 6px;
    color: var(--pine-deep);
  }
  .sub{ color:var(--ink-soft); font-size:15px; margin:0 0 34px; max-width: 46ch; line-height:1.7;}

  /* cards grid */
  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 640px){ .grid{ grid-template-columns: 1fr; } }

  .card{
    position:relative;
    background: var(--paper);
    border:1px solid var(--line);
    border-radius: 18px;
    padding: 24px 22px;
    text-align:right;
    cursor:pointer;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    box-shadow: var(--shadow);
  }
  .card:hover{ transform: translateY(-3px); border-color: var(--amber); }
  .card:focus-visible{ outline: 3px solid var(--amber); outline-offset: 3px; }

  .card-label{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size: 13px;
    color: var(--amber);
    letter-spacing:.04em;
    margin-bottom: 14px;
    display:block;
  }

  .name-value{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size: 22px;
    color: var(--pine-deep);
    min-height: 28px;
  }
  .name-value.placeholder{ color: var(--ink-soft); font-weight:500; font-size:16px; }

  .logo-row{ display:flex; align-items:center; gap:14px; }
  .logo-frame{
    width:58px; height:58px; border-radius: 14px;
    background: var(--pine);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; flex-shrink:0;
    border: 1px solid var(--pine-deep);
  }
  .logo-frame img{ width:100%; height:100%; object-fit:cover; }
  .logo-frame svg{ width:26px; height:26px; }
  .logo-caption{ color: var(--ink-soft); font-size:14px; }

  .chev{
    position:absolute; top:22px; left:20px;
    color: var(--ink-soft); font-size:18px;
  }

  /* stamp signature element */
  .stamp{
    position:absolute; bottom: -10px; left:-10px;
    width:64px; height:64px;
    opacity:0;
    transform: scale(1.4) rotate(-18deg);
    transition: opacity .35s ease, transform .35s cubic-bezier(.2,1.4,.4,1);
    pointer-events:none;
  }
  .stamp.show{ opacity:1; transform: scale(1) rotate(-12deg); }
  .stamp svg{ width:100%; height:100%; }

  /* panel (slide-down editor) */
  .panel-anchor{ grid-column: 1 / -1; }
  .panel{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .38s ease, opacity .3s ease, margin .38s ease;
    margin-top:0;
  }
  .panel.open{ max-height: 420px; opacity:1; margin-top: 16px; }

  .panel-inner{
    background: var(--pine-deep);
    border-radius: 18px;
    padding: 26px 24px;
    color:#F4EFE3;
    position:relative;
  }
  .panel-title{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:15px;
    color: var(--amber-soft);
    margin: 0 0 18px;
    display:flex; align-items:center; gap:10px;
  }
  .panel-title .bar{ width:22px; height:2px; background:var(--amber); display:inline-block; }

  .field-label{ font-size:13px; color:#C9C2B2; margin-bottom:8px; display:block; }
  .field{
    width:100%;
    background: rgba(245,239,227,0.06);
    border: 1px solid rgba(245,239,227,0.22);
    border-radius: 12px;
    padding: 14px 16px;
    color: #F8F4EA;
    font-family:'Tajawal', sans-serif;
    font-size:16px;
    outline:none;
    transition: border-color .15s ease, background .15s ease;
  }
  .field::placeholder{ color:#9A9282; }
  .field:focus{ border-color: var(--amber); background: rgba(245,239,227,0.1); }

  .btn-row{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .btn{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius: 12px;
    padding: 13px 22px;
    cursor:pointer;
    transition: filter .15s ease, transform .1s ease;
  }
  .btn:active{ transform: scale(.98); }
  .btn-save{ background: var(--amber); color: var(--pine-deep); }
  .btn-save:hover{ filter: brightness(1.08); }
  .btn-ghost{
    background: transparent; color:#F4EFE3;
    border: 1px solid rgba(245,239,227,0.3);
  }
  .btn-ghost:hover{ border-color: rgba(245,239,227,0.6); }
  .btn-danger{
    background: transparent; color: #E8B39C;
    border: 1px solid rgba(160,71,44,0.6);
  }
  .btn-danger:hover{ background: rgba(160,71,44,0.18); }
  .btn-block{ width:100%; text-align:center; justify-content:center; }
  .btn-full-row{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  .btn svg{ vertical-align:-3px; margin-left:6px; width:16px; height:16px; }

  .close-x{
    position:absolute; top:20px; left:20px;
    background:none; border:none; color:#C9C2B2; cursor:pointer;
    font-size:18px; line-height:1; padding:4px;
  }
  .close-x:hover{ color:#fff; }

  .toast{
    position: fixed; bottom: 26px; right: 50%; transform: translateX(50%) translateY(20px);
    background: var(--pine-deep); color:#F4EFE3;
    padding: 12px 20px; border-radius: 12px;
    font-size:14px; font-weight:700;
    box-shadow: var(--shadow);
    opacity:0; pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{ opacity:1; transform: translateX(50%) translateY(0); }
  .toast .amber-dot{ width:8px;height:8px;border-radius:50%; background:var(--amber); }

  .hidden-input{ display:none; }
  .file-name{ font-size:13px; color:#C9C2B2; margin-top:8px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow"><span class="dot"></span> إعدادات النظام</div>
  <h1>هوية المطعم</h1>
  <p class="sub">الاسم والشعار هما ما يتعرّف عليهما عملاؤك أولًا. عدّلهما هنا، وستظهر التغييرات في كل مكان يظهر فيه مطعمك بالنظام.</p>

  <div class="grid">

    <!-- بطاقة الاسم -->
    <div class="card" id="nameCard" tabindex="0" role="button" aria-expanded="false">
      <span class="card-label">الاسم</span>
      <div class="name-value placeholder" id="nameValue">لم يتم إدخال اسم المطعم بعد</div>
      <span class="chev">‹</span>
      <div class="stamp" id="nameStamp">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#C6883A" stroke-width="3"/><circle cx="50" cy="50" r="37" fill="none" stroke="#C6883A" stroke-width="1.5"/><text x="50" y="46" text-anchor="middle" font-family="Cairo, sans-serif" font-size="13" font-weight="800" fill="#C6883A">تم</text><text x="50" y="62" text-anchor="middle" font-family="Cairo, sans-serif" font-size="9" fill="#C6883A">الحفظ</text></svg>
      </div>
    </div>

    <!-- بطاقة الشعار -->
    <div class="card" id="logoCard" tabindex="0" role="button" aria-expanded="false">
      <span class="card-label">الشعار</span>
      <div class="logo-row">
        <div class="logo-frame" id="logoFrame">
          <svg viewBox="0 0 24 24" fill="none" stroke="#EBD3AA" stroke-width="1.6"><path d="M4 17l4.5-5 3 3 3-4L20 17" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="4" width="18" height="16" rx="3"/></svg>
        </div>
        <div class="logo-caption" id="logoCaption">لا يوجد شعار مضاف</div>
      </div>
      <span class="chev">‹</span>
    </div>

    <!-- لوحة تحرير الاسم -->
    <div class="panel-anchor">
      <div class="panel" id="namePanel">
        <div class="panel-inner">
          <button class="close-x" data-close="namePanel" aria-label="إغلاق">✕</button>
          <div class="panel-title"><span class="bar"></span> تعديل اسم المطعم</div>
          <label class="field-label" for="nameInput">اسم المطعم</label>
          <input class="field" id="nameInput" type="text" placeholder="مثال: مطعم الأصالة" maxlength="60">
          <div class="btn-row">
            <button class="btn btn-save" id="saveNameBtn">محفوظ</button>
            <button class="btn btn-ghost" data-close="namePanel">إلغاء</button>
          </div>
        </div>
      </div>
    </div>

    <!-- لوحة الشعار -->
    <div class="panel-anchor">
      <div class="panel" id="logoPanel">
        <div class="panel-inner">
          <button class="close-x" data-close="logoPanel" aria-label="إغلاق">✕</button>
          <div class="panel-title"><span class="bar"></span> شعار المطعم</div>
          <div class="btn-full-row">
            <button class="btn btn-save btn-block" id="addLogoBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="#1E332A" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
              إضافة شعار المطعم
            </button>
            <button class="btn btn-danger btn-block" id="removeLogoBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="#E8B39C" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              حذف شعار المطعم
            </button>
          </div>
          <input type="file" accept="image/*" class="hidden-input" id="logoFileInput">
          <div class="file-name" id="fileNameLabel"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"><span class="amber-dot"></span><span id="toastText"></span></div>

<script>
  const nameCard = document.getElementById('nameCard');
  const logoCard = document.getElementById('logoCard');
  const namePanel = document.getElementById('namePanel');
  const logoPanel = document.getElementById('logoPanel');
  const nameInput = document.getElementById('nameInput');
  const nameValue = document.getElementById('nameValue');
  const nameStamp = document.getElementById('nameStamp');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  const logoFileInput = document.getElementById('logoFileInput');
  const logoFrame = document.getElementById('logoFrame');
  const logoCaption = document.getElementById('logoCaption');
  const fileNameLabel = document.getElementById('fileNameLabel');

  function togglePanel(panel, card, otherPanel, otherCard){
    const isOpen = panel.classList.contains('open');
    otherPanel.classList.remove('open');
    otherCard.setAttribute('aria-expanded', 'false');
    if(isOpen){
      panel.classList.remove('open');
      card.setAttribute('aria-expanded', 'false');
    } else {
      panel.classList.add('open');
      card.setAttribute('aria-expanded', 'true');
      if(panel === namePanel){ nameInput.focus(); }
    }
  }

  nameCard.addEventListener('click', () => togglePanel(namePanel, nameCard, logoPanel, logoCard));
  logoCard.addEventListener('click', () => togglePanel(logoPanel, logoCard, namePanel, nameCard));
  [nameCard, logoCard].forEach(c => c.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); c.click(); }
  }));

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const panel = document.getElementById(btn.dataset.close);
      panel.classList.remove('open');
      (panel === namePanel ? nameCard : logoCard).setAttribute('aria-expanded', 'false');
    });
  });

  function showToast(msg){
    toastText.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  document.getElementById('saveNameBtn').addEventListener('click', () => {
    const val = nameInput.value.trim();
    if(!val){
      nameInput.focus();
      nameInput.style.borderColor = '#A0472C';
      setTimeout(() => nameInput.style.borderColor = '', 900);
      return;
    }
    nameValue.textContent = val;
    nameValue.classList.remove('placeholder');
    namePanel.classList.remove('open');
    nameCard.setAttribute('aria-expanded', 'false');
    showToast('تم حفظ اسم المطعم');
    nameStamp.classList.add('show');
    setTimeout(() => nameStamp.classList.remove('show'), 1600);
  });

  document.getElementById('addLogoBtn').addEventListener('click', () => logoFileInput.click());

  logoFileInput.addEventListener('change', () => {
    const file = logoFileInput.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    logoFrame.innerHTML = `<img src="${url}" alt="شعار المطعم">`;
    logoCaption.textContent = 'تم إضافة الشعار';
    fileNameLabel.textContent = file.name;
    showToast('تم إضافة شعار المطعم');
  });

  document.getElementById('removeLogoBtn').addEventListener('click', () => {
    logoFrame.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#EBD3AA" stroke-width="1.6"><path d="M4 17l4.5-5 3 3 3-4L20 17" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="4" width="18" height="16" rx="3"/></svg>`;
    logoCaption.textContent = 'لا يوجد شعار مضاف';
    fileNameLabel.textContent = '';
    logoFileInput.value = '';
    showToast('تم حذف شعار المطعم');
  });
</script>
</body>
</html>
