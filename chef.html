<body>  
    <!-- مكتبات الفايربيس للربط السحابي -->

    <div class="container">  
        <header>  
            <h1>👨‍🍳 شاشة الشيف</h1>  
            <div class="statistics">  
                <div class="card red">  
                    <span id="newCount">0</span>  
                    <p>طلبات جديدة</p>  
                </div>  
                <div class="card yellow">  
                    <span id="preparingCount">0</span>  
                    <p>قيد التحضير</p>  
                </div>  
                <div class="card green">  
                    <span id="readyCount">0</span>  
                    <p>جاهزة</p>  
                </div>  
            </div>  
        </header>  

        <section class="toolbar">  
            <input  
                type="text"  
                id="search"  
                placeholder="🔍 البحث برقم الطاولة..."  
            >  
            <button id="refreshBtn">تحديث 🔄</button>  
        </section>  

        <section id="ordersContainer" class="orders">  
            <!-- الطلبات تظهر هنا -->  
        </section>
    </div>  

    <template id="orderTemplate">  
        <div class="order-card">  
            <div class="top">  
                <h2>  
                    🍽️ طاولة <span class="tableNumber"></span>  
                </h2>  
                <span class="status new">جديد</span>  
            </div>  
            <div class="body">  
                <h3>الأصناف</h3>  
                <ul class="items"></ul>  
                <div class="note">  
                    <strong>ملاحظات:</strong>  
                    <p class="notes"></p>  
                </div>  
                <div class="timer">  
                    ⏱️ <span class="time">00:00</span>  
                </div>  
            </div>  
            <div class="buttons">  
                <button class="startBtn">▶ بدء التحضير</button>  
                <button class="finishBtn">✅ تم الانتهاء</button>  
            </div>
        </div>  
    </template>  

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
